# Codemagic CI/CD — Datafit
#
# PRE-REQUISITOS no painel do Codemagic (fazer uma vez, depois que a Apple
# aprovar a conta de desenvolvedor):
#
#   1. FEITO: App Store Connect API Key conectada em Teams > Integrations >
#      Developer Portal com o nome "DATAFIT" (referenciado em app_store_connect
#      abaixo). A chave precisa ter papel Admin ou App Manager COM acesso a
#      "Certificates, Identifiers & Profiles" — sem isso o Codemagic autentica
#      mas nao consegue criar o provisioning profile.
#
#   2. FEITO: app criado no App Store Connect com o bundle com.virtus.datafit,
#      Apple ID numerico 6798420221 ja preenchido em APP_STORE_APPLE_ID.
#
#   3. Environment variables > grupo "datafit_ios": nada obrigatorio hoje,
#      o grupo existe para segredos futuros.

workflows:
  ios-testflight:
    name: iOS — build e envio pro TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: datafit

    integrations:
      # Nome EXATO da integracao em Teams > Integrations > Developer Portal.
      # Se nao bater, o Codemagic segue sem credenciais da App Store Connect e
      # a assinatura falha com "No matching profiles found for bundle identifier".
      app_store_connect: DATAFIT

    environment:
      # Versao fixa, nao `stable`. O `stable` avancou por baixo e trouxe um
      # flutter_localizations que exige intl ^0.20.3, enquanto o pubspec fixa
      # 0.20.2 — o pub get quebrou no CI enquanto o build local seguia
      # passando. Fixar aqui faz o artefato do TestFlight sair do mesmo SDK
      # em que o codigo e analisado e compilado antes de subir.
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      # Sem bloco `ios_signing:` de proposito. A assinatura e feita
      # explicitamente nos scripts abaixo (fetch-signing-files --create), porque
      # a conta e nova e ainda nao tem certificado de distribuicao. Manter os
      # dois mecanismos juntos faz o automatico e o manual disputarem a keychain.
      vars:
        BUNDLE_ID: "com.virtus.datafit"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        # Apple ID numerico do app no App Store Connect
        # (App Information > General Information > Apple ID)
        APP_STORE_APPLE_ID: 6798420221
      groups:
        # Precisa conter a variavel SEGURA CERTIFICATE_PRIVATE_KEY: a chave
        # privada RSA (PEM completo) do certificado de distribuicao.
        # A Apple so devolve a parte publica do certificado; sem a chave privada
        # o fetch-signing-files aborta com "Cannot save Signing Certificates
        # without certificate private key".
        # NUNCA commitar essa chave -- este repositorio e publico.
        - datafit_ios

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true

    scripts:
      - name: Dependencias Flutter
        script: flutter pub get

      - name: Build number a partir do TestFlight
        script: |
          set -e
          LATEST=$(app_store_connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo "0")
          echo "Ultimo build no TestFlight: $LATEST"
          echo $(($LATEST + 1)) > /tmp/build_number
          echo "Novo build number: $(cat /tmp/build_number)"

      - name: CocoaPods
        script: |
          set -e
          find . -name "Podfile" -execdir pod install \;

      # --- Assinatura -------------------------------------------------------
      # Ordem obrigatoria: initialize -> fetch -> add-certificates -> use-profiles.
      # `use-profiles` sozinho so aplica o que ja esta no disco; sem o fetch antes
      # ele falha com "No matching profiles found for bundle identifier".

      - name: Inicializa a keychain
        script: keychain initialize

      - name: Busca (ou cria) certificado e provisioning profile
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          echo "--- Profiles baixados ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true

      - name: Adiciona os certificados na keychain
        script: keychain add-certificates

      - name: Aplica os perfis no projeto Xcode
        script: xcode-project use-profiles

      # O aparelho so conseguia dizer "nao registrei no APNs", nunca por que.
      # Esta etapa responde do lado do build: se aps-environment nao aparecer
      # aqui, o perfil e velho (foi emitido antes de a capability Push existir
      # no App ID) e precisa ser apagado no portal para o --create refazer.
      # `|| true` em tudo: e diagnostico, nao pode derrubar a publicacao.
      - name: Push chegou no provisioning profile?
        script: |
          # `find` em vez de glob: a busca anterior nao encontrava nada e o
          # shell devolvia o proprio padrao como se fosse um arquivo, fazendo
          # a etapa imprimir "SEM aps-environment" para um perfil inexistente.
          PERFIS=$(find ~/Library/MobileDevice -name "*.mobileprovision" 2>/dev/null)
          if [ -z "$PERFIS" ]; then
            echo "Nenhum .mobileprovision encontrado em ~/Library/MobileDevice"
          fi
          echo "$PERFIS" | while read -r p; do
            [ -z "$p" ] && continue
            echo "--- $(basename "$p") ---"
            security cms -D -i "$p" 2>/dev/null \
              | plutil -extract Entitlements xml1 -o - - 2>/dev/null \
              | grep -A2 -i "aps-environment" || echo "SEM aps-environment"
          done
          true

      - name: Build do IPA
        script: |
          set -e
          flutter build ipa --release \
            --build-number=$(cat /tmp/build_number) \
            --export-options-plist=/Users/builder/export_options.plist

      # Confere o que foi realmente assinado, e nao o que o projeto pediu: o
      # entitlement pode estar no Runner.entitlements e mesmo assim ser
      # removido na assinatura se o perfil nao o conceder.
      - name: Push chegou no binario assinado?
        script: |
          APP=$(find build/ios/archive -name "Runner.app" -maxdepth 4 | head -1)
          echo "App: $APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null \
            | grep -A2 -i "aps-environment" || echo "SEM aps-environment no binario"
          true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # O binario sobe e fica disponivel para os testadores INTERNOS na
        # hora, sem revisao da Apple — que e o que a gente usa hoje.
        #
        # `submit_to_testflight: true` ficou desligado porque ele submete para
        # o teste EXTERNO, que exige revisao e a ficha de "Test Information"
        # preenchida. Sem ela o passo falha e o build inteiro e marcado como
        # vermelho, mesmo com o binario ja processado e instalavel.
        #
        # Ligar de novo quando for abrir para testadores de fora, com a ficha
        # em https://appstoreconnect.apple.com/apps/6798420221/testflight/test-info
        submit_to_testflight: false
        # Deixar em false ate a ficha da loja estar completa e o IAP decidido.
        submit_to_app_store: false
      email:
        recipients:
          - pedroluiz9922@icloud.com
        notify:
          success: true
          failure: true

  # Workflow opcional so para validar que o projeto compila, sem assinar.
  # Serve pra testar o pipeline ANTES de ter a conta Apple aprovada.
  ios-build-check:
    name: iOS — compilacao sem assinatura (smoke test)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: datafit

    environment:
      # Versao fixa, nao `stable`. O `stable` avancou por baixo e trouxe um
      # flutter_localizations que exige intl ^0.20.3, enquanto o pubspec fixa
      # 0.20.2 — o pub get quebrou no CI enquanto o build local seguia
      # passando. Fixar aqui faz o artefato do TestFlight sair do mesmo SDK
      # em que o codigo e analisado e compilado antes de subir.
      flutter: 3.44.2
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Dependencias Flutter
        script: flutter pub get

      - name: Analise estatica
        script: flutter analyze --no-fatal-infos || true

      - name: Build sem assinatura
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - pedroluiz9922@icloud.com
        notify:
          success: false
          failure: true
